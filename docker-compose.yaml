version: '3'

networks:
  Api.Network:
    name: Api.Network
    driver: bridge

services:
  db:
    container_name: Api.Database
    image: postgis/postgis:16-3.5-alpine
    # extra_hosts: [ 'host.docker.internal:host-gateway' ]
    restart: unless-stopped
    environment:
      POSTGRES_DB: Api.Database
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      # any intial sql to run can be added into ./config/init.sql
      # - ./config/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # enable this line if you want to save database data in case of
      # database container is dropped
      - ./docker/postgresql/data:/var/lib/postgresql/data
    ports:
      - 14321:5432
    networks:
      - Api.Network
  db.test:
    container_name: Api.Test.Database
    image: postgis/postgis:16-3.5-alpine
    # extra_hosts: [ 'host.docker.internal:host-gateway' ]
    restart: unless-stopped
    environment:
      POSTGRES_DB: Api.Test.Database
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - 14322:5432
    networks:
      - Api.Network
